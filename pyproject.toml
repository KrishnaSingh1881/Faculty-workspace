[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3,<4",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1",
  "pymupdf>=1.24",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["exam_assistant*"]

[tool.setuptools.package-data]
"exam_assistant.migrations" = ["script.py.mako"]

[tool.ruff]
line-length = 100
