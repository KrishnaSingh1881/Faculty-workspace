services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: faculty
      POSTGRES_USER: faculty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculty -d faculty"]
      interval: 5s
      timeout: 3s
      retries: 20

  workspace:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://faculty:${POSTGRES_PASSWORD}@postgres:5432/faculty
      AUTH_MODE: shared
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      MODEL_URL: ${MODEL_URL:-http://host.docker.internal:11434}
      JUDGE_MODEL_NAME: ${JUDGE_MODEL_NAME:-gemma4:12b}
      HELPER_MODEL_NAME: ${HELPER_MODEL_NAME:-gemma4:12b}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-qwen3-embedding:4b}
      MODEL_THINKING: ${MODEL_THINKING:-auto}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-2048}
      CHAT_CONTEXT_TOKENS: ${CHAT_CONTEXT_TOKENS:-8192}
      COMPARISON_CONTEXT_TOKENS: ${COMPARISON_CONTEXT_TOKENS:-8192}
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-30}
      OCR_MODEL_NAME: ${OCR_MODEL_NAME:-hf.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${WORKSPACE_PORT:-8000}:8000"
    volumes:
      - workspace_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  workspace_data:
