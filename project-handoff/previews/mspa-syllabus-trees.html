<script>
(() => {
const root=document.getElementById('mspa-tree-explorer');
const data=JSON.parse(document.getElementById('mspa-data').textContent);
const subject=root.querySelector('#mspa-subject'),search=root.querySelector('#mspa-search'),tree=root.querySelector('#mspa-tree'),count=root.querySelector('#mspa-count');
let current='os';
const E=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{subject:current,search:search.value},privateContent:{}}).catch(()=>{});}
function link(id,label){const b=E('button',label||id,'btn btn-ghost node-link');b.type='button';b.onclick=()=>{search.value='';filter();const target=document.getElementById('node-'+id);if(!target)return;let p=target.parentElement;while(p&&p!==tree){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement;}const details=target.querySelector('.node-detail');if(details)details.open=true;target.scrollIntoView({behavior:'auto',block:'center'});remember();};return b;}
function raw(parent,obj){const d=E('details');d.append(E('summary','Complete stored data'));const pre=E('pre');pre.append(E('code',JSON.stringify(obj,null,2)));d.append(pre);parent.append(d);}
function field(dl,title,value){if(value===undefined||value===null||Array.isArray(value)&&!value.length)return;dl.append(E('dt',title));const dd=E('dd');if(Array.isArray(value)){const ul=E('ul');for(const v of value)ul.append(E('li',typeof v==='object'?JSON.stringify(v):v));dd.append(ul);}else dd.textContent=typeof value==='object'?JSON.stringify(value):value;dl.append(dd);}
function detail(n,d){const box=E('details',undefined,'node-detail');box.append(E('summary','Knowledge, boundaries & links'));box.addEventListener('toggle',()=>{if(!box.open||box.dataset.loaded)return;box.dataset.loaded='yes';const dl=E('dl');field(dl,'Node ID',n.id);field(dl,'Original syllabus',n.source_text);field(dl,'Description',n.description);field(dl,'Review',n.review_status||d.review.status);field(dl,'Unit metadata',n.unit_meta);field(dl,'Exact / contextual aliases',n.synonyms);field(dl,'Acronyms',n.acronyms);field(dl,'Related terms — not aliases',n.related_terms);field(dl,'Reference key points — not mandatory answer requirements',n.key_points);field(dl,'Included scope',n.concept_boundary?.includes);field(dl,'Excluded / distinct scope',n.concept_boundary?.excludes);field(dl,'Scope terms',n.scope_terms);field(dl,'Context words',n.context_words);field(dl,'Possible assessment tasks',n.task_types);field(dl,'Preserve from the question',n.assessment_guidance?.preserve);field(dl,'Supporting examples — review needed',n.supporting_examples);field(dl,'Uncertain terms / decisions needed',n.uncertain_terms);box.append(dl);
if(n.assessed_aspects?.length){box.append(E('h3','Assessed aspects'));for(const a of n.assessed_aspects){const x=E('div',undefined,'aspect');x.append(E('strong',a.label),E('p',a.scope),E('span',a.id,'text-small'));box.append(x);}}
if(n.distinguish_from?.length){box.append(E('h3','Same-unit distinctions'));for(const l of n.distinguish_from){const x=E('div');const target=d.nodes.find(v=>v.id===l.node);x.append(link(l.node,target?.label),E('p',l.how));box.append(x);}}
const cross=[...(d.cross_links||[]),...(d.disambiguation_links||[])].filter(l=>l.a===n.id||l.b===n.id);if(cross.length){box.append(E('h3','Display / tagging links — not verdict inputs'));for(const l of cross){const target=l.a===n.id?l.b:l.a;const x=E('div');x.append(link(target,d.nodes.find(v=>v.id===target)?.label),E('p',l.note||l.reason));box.append(x);}}
raw(box,n);});return box;}
function render(){const d=data[current];tree.replaceChildren();const byParent=new Map();for(const n of d.nodes){if(!byParent.has(n.parent))byParent.set(n.parent,[]);byParent.get(n.parent).push(n);}function build(parent){const ul=E('ul',undefined,parent===null?'tree-list tree-root':'tree-list');for(const n of (byParent.get(parent)||[]).sort((a,b)=>a.order-b.order)){const li=E('li',undefined,'tree-item');li.id='node-'+n.id;li.dataset.node=n.id;li.dataset.search=JSON.stringify(n).toLowerCase();const children=byParent.get(n.id)||[];const heading=E('span',n.label);const kind=E('span',' · '+n.kind,'text-small kind');if(children.length){const branch=E('details',undefined,'branch');branch.open=true;const summary=E('summary');summary.append(heading,kind);branch.append(summary,detail(n,d),build(n.id));li.append(branch);}else{const row=E('div',undefined,'tree-heading');row.append(heading,kind);li.append(row,detail(n,d));}ul.append(li);}return ul;}tree.append(build(null));const meta=root.querySelector('#mspa-metadata');meta.replaceChildren();raw(meta,Object.fromEntries(Object.entries(d).filter(([k])=>k!=='nodes')));filter();}
function filter(){const q=search.value.trim().toLowerCase(),d=data[current],allowed=new Set();let matches=0;const index=new Map(d.nodes.map(n=>[n.id,n]));for(const n of d.nodes){const fields={...n};delete fields.original_enrichment;delete fields.distinguish_from;delete fields.child_topic_ids;if(!q||JSON.stringify(fields).toLowerCase().includes(q)){matches++;let p=n;while(p){allowed.add(p.id);p=index.get(p.parent);}}}for(const li of tree.querySelectorAll('[data-node]')){li.hidden=!allowed.has(li.dataset.node);if(q&&allowed.has(li.dataset.node)){const b=li.querySelector(':scope > .branch');if(b)b.open=true;}}count.textContent=q?`${matches} matching nodes · ancestors retained`:`${d.nodes.length} syllabus nodes · ${d.validation.assessed_aspects} internal aspects · needs review`;}
subject.onchange=()=>{current=subject.value;search.value='';render();remember();};search.oninput=()=>{filter();remember();};root.querySelector('#mspa-expand').onclick=()=>{tree.querySelectorAll('.branch').forEach(x=>x.open=true);};root.querySelector('#mspa-collapse').onclick=()=>{tree.querySelectorAll('.branch').forEach(x=>x.open=false);};
function restore(state){const m=state?.modelContent;if(m&&data[m.subject]){current=m.subject;subject.value=current;search.value=m.search||'';}render();}
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
})();
</script>
